name: Pipeline de Testes BDD Cypress

on:
  push:
    branches:
      [ main , master ]
  pull_request:
    branches:
      [ main , master ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome

      - name: Salvar Evidencias
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path:
            cypress/videos
            cypress/screenshots
          if-no-files-found: ignore